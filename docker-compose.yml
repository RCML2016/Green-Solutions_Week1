version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: gs-mongo
    ports:
      - "27017:27017"
    volumes:
      - gs_mongo_data:/data/db

  backend:
    build: ./backend
    container_name: gs-backend
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: green_solutions
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    container_name: gs-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  gs_mongo_data:
