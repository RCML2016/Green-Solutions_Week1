name: security-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject merge markers and insecure CORS
        run: |
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.js' '*.jsx'
          ! git grep -n -F 'allow_origins=["*"]' -- '*.py'
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install unit-test dependencies
        run: >-
          python -m pip install pytest pydantic fastapi pymongo motor bcrypt
         PyJWT python-multipart openpyxl requests python-dotenv
      - name: Run backend unit tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: assetnova_test
          JWT_SECRET: ci-only-secret
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: PYTHONPATH=backend python -m pytest -q -c /dev/null backend/tests/test_fleet_admin_models.py

  connector-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assetnova-connectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: docker build -t assetnova-connectors:test .
