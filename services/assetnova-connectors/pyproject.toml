[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assetnova-connectors"
version = "0.1.0"
description = "Production-oriented ingestion connectors for AssetNova"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "aiokafka>=0.11,<1",
  "asyncpg>=0.29,<1",
  "redis[hiredis]>=5,<6",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
assetnova-connector = "assetnova_connectors.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assetnova_connectors"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
