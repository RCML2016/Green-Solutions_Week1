services:
  connector-api:
    build: .
    ports: ["8080:8080"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
    depends_on: [redpanda, redis]
    restart: unless-stopped
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","512M","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","0.0.0.0:9092","--advertise-kafka-addr","redpanda:9092"]
    ports: ["19092:9092"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis-data:/data"]
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: assetnova
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: assetnova
    ports: ["5432:5432"]
    volumes: ["timescale-data:/var/lib/postgresql/data"]
volumes:
  redpanda-data:
  redis-data:
  timescale-data:

